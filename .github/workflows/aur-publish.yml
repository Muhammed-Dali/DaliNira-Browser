name: Publish AUR packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to submit to the AUR packages
        required: true
        default: v8.0.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [dalinira, dalinira-bin]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Validate release and AUR credentials
        run: |
          set -euo pipefail
          test -n "${AUR_SSH_PRIVATE_KEY}" || { echo 'Set repository secret AUR_SSH_PRIVATE_KEY first' >&2; exit 1; }
          gh release view "${{ inputs.release_tag }}" >/dev/null

      - name: Checkout release packaging recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download archive and prepare AUR metadata
        run: |
          set -euo pipefail
          version="${{ inputs.release_tag }}"
          version="${version#v}"
          recipe_dir="packaging/aur/${AUR_PACKAGE}"
          test "${{ inputs.release_tag }}" = "v${version}"
          test "$(sed -n 's/^pkgname=//p' "${recipe_dir}/PKGBUILD")" = "${AUR_PACKAGE}"
          test "$(sed -n 's/^pkgver=//p' "${recipe_dir}/PKGBUILD")" = "${version}"
          archive="dalinira-browser-${version}-linux-x86_64.tar.zst"
          # The private WebKitGTK runtime built on Arch Linux (packaging/webkit-runtime).
          runtime="dalinira-webkit-runtime-${version}-arch-x86_64.tar.zst"
          gh release download "${{ inputs.release_tag }}" --pattern "${archive}" --pattern "${runtime}" --dir "${RUNNER_TEMP}"
          checksum="$(sha256sum "${RUNNER_TEMP}/${archive}" | cut -d' ' -f1)"
          runtime_checksum="$(sha256sum "${RUNNER_TEMP}/${runtime}" | cut -d' ' -f1)"
          cp "${recipe_dir}/PKGBUILD" "${RUNNER_TEMP}/PKGBUILD"
          cp "${recipe_dir}/.SRCINFO" "${RUNNER_TEMP}/.SRCINFO"
          # Two sources, in this order: the portable archive, the runtime.
          sed -i -z "s/sha256sums=('SKIP'\n            'SKIP')/sha256sums=('${checksum}'\n            '${runtime_checksum}')/" "${RUNNER_TEMP}/PKGBUILD"
          sed -i -E "s/^([[:space:]]*pkgver = ).*/\1${version}/" "${RUNNER_TEMP}/.SRCINFO"
          sed -i -E "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/#releases/download/v${version}/#g" "${RUNNER_TEMP}/.SRCINFO"
          sed -i -E "s#dalinira-browser-[0-9]+\.[0-9]+\.[0-9]+-linux-x86_64#dalinira-browser-${version}-linux-x86_64#g" "${RUNNER_TEMP}/.SRCINFO"
          sed -i -E "s#dalinira-webkit-runtime-[0-9]+\.[0-9]+\.[0-9]+-arch-x86_64#dalinira-webkit-runtime-${version}-arch-x86_64#g" "${RUNNER_TEMP}/.SRCINFO"
          sed -i "0,/sha256sums = SKIP/s//sha256sums = ${checksum}/" "${RUNNER_TEMP}/.SRCINFO"
          sed -i "0,/sha256sums = SKIP/s//sha256sums = ${runtime_checksum}/" "${RUNNER_TEMP}/.SRCINFO"
          grep -F "pkgver = ${version}" "${RUNNER_TEMP}/.SRCINFO"
          grep -F "sha256sums=('${checksum}'" "${RUNNER_TEMP}/PKGBUILD"
          grep -F "            '${runtime_checksum}')" "${RUNNER_TEMP}/PKGBUILD"
          grep -F "sha256sums = ${checksum}" "${RUNNER_TEMP}/.SRCINFO"
          grep -F "sha256sums = ${runtime_checksum}" "${RUNNER_TEMP}/.SRCINFO"
          if grep -q SKIP "${RUNNER_TEMP}/PKGBUILD" "${RUNNER_TEMP}/.SRCINFO"; then exit 1; fi

      - name: Push the AUR package
        run: |
          set -euo pipefail
          install -dm700 "${HOME}/.ssh"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -H aur.archlinux.org >> "${HOME}/.ssh/known_hosts"
          aur_dir="${RUNNER_TEMP}/aur-${AUR_PACKAGE}"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" "${aur_dir}"
          cp "${RUNNER_TEMP}/PKGBUILD" "${aur_dir}/PKGBUILD"
          cp "${RUNNER_TEMP}/.SRCINFO" "${aur_dir}/.SRCINFO"
          git -C "${aur_dir}" add PKGBUILD .SRCINFO
          if git -C "${aur_dir}" diff --cached --quiet; then exit 0; fi
          git -C "${aur_dir}" -c user.name='Muhammed Dali' \
            -c user.email='dali.nira.12.1453kerinyoli@gmail.com' commit -m "Update ${AUR_PACKAGE} to ${{ inputs.release_tag }}"
          git -C "${aur_dir}" push origin HEAD
