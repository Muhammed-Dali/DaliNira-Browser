name: Publish Pacman Repo

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published v-prefixed release tag to package
        required: true
        default: v8.0.2
        type: string

permissions:
  contents: read

concurrency:
  group: pacman-repo
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
  # Fingerprint of the DaliNira pacman signing key (secret PACMAN_GPG_PRIVATE_KEY).
  PACMAN_SIGNING_KEY: BC741FD0AC804351B0DDBB86FDFEC60C11202588

jobs:
  publish:
    name: Build and publish pacman package
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted packaging recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Install packaging tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel git github-cli nodejs pacman-contrib
          # No -debug split package: the jobs expect exactly the release package, as
          # built and validated locally (makepkg.conf there has !debug).
          sed -i -E '/^OPTIONS=/s/([( ])debug([ )])/\1!debug\2/' /etc/makepkg.conf

      - name: Validate release and package metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "${RELEASE_TAG}" = "v${version}"
          test "$(node -p "require('./package.json').version")" = "${version}"
          test "$(sed -n 's/^pkgver=//p' packaging/pacman/PKGBUILD)" = "${version}"
          release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          ci_run="$(gh run list --workflow ci.yml --commit "${release_sha}" --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "${ci_run}"
          gh run watch "${ci_run}" --exit-status --interval 60

      - name: Import the repository signing key
        env:
          PACMAN_GPG_PRIVATE_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PACMAN_GPG_PRIVATE_KEY}" ]; then
            echo "::error::The PACMAN_GPG_PRIVATE_KEY secret is not set; the repository is published signed only."
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          install -dm700 "${GNUPGHOME}"
          echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"
          printf '%s\n' "${PACMAN_GPG_PRIVATE_KEY}" | gpg --batch --quiet --import
          # The secret must hold the key users trust (README, dalinira.repo).
          gpg --batch --list-secret-keys --with-colons | grep -qx "fpr:::::::::${PACMAN_SIGNING_KEY}:"

      - name: Build native binary package
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c "cd '${GITHUB_WORKSPACE}/packaging/pacman' && makepkg -f --nodeps --noconfirm"

      - name: Generate the signed repository and Pages content
        run: |
          set -euo pipefail
          # The repository is served from GitHub Pages (x86_64/). Releases in
          # this repository are immutable, so a release cannot hold a database
          # that changes with every version.
          repo_root="${GITHUB_WORKSPACE}/pacman-repo"
          out_dir="${repo_root}/x86_64"
          install -dm755 "${out_dir}"
          cp -a website/. "${repo_root}/"
          install -Dm644 packaging/pacman/index.html "${repo_root}/pacman.html"
          install -Dm644 packaging/pacman/dalinira.repo "${repo_root}/dalinira.repo"
          pkg_path="$(find packaging/pacman -maxdepth 1 -type f -name 'dalinira-[0-9]*-x86_64.pkg.tar.zst' -print -quit)"
          test -n "${pkg_path}"
          pkg_name="$(basename "${pkg_path}")"
          install -Dm644 "${pkg_path}" "${out_dir}/${pkg_name}"
          gpg --batch --yes --detach-sign --no-armor --local-user "${PACMAN_SIGNING_KEY}" \
            --output "${out_dir}/${pkg_name}.sig" "${out_dir}/${pkg_name}"
          repo-add --sign --key "${PACMAN_SIGNING_KEY}" "${out_dir}/dalinira.db.tar.gz" "${out_dir}/${pkg_name}"
          # repo-add leaves symlinks; Pages serves regular files.
          for name in dalinira.db dalinira.files; do
            rm -f "${out_dir}/${name}" "${out_dir}/${name}.sig"
            cp -f "${out_dir}/${name}.tar.gz" "${out_dir}/${name}"
            if [ -f "${out_dir}/${name}.tar.gz.sig" ]; then
              cp -f "${out_dir}/${name}.tar.gz.sig" "${out_dir}/${name}.sig"
            fi
          done
          gpg --batch --verify "${out_dir}/${pkg_name}.sig" "${out_dir}/${pkg_name}"
          gpg --batch --verify "${out_dir}/dalinira.db.sig" "${out_dir}/dalinira.db"
          gpg --batch --export --armor "${PACMAN_SIGNING_KEY}" > "${repo_root}/dalinira.gpg"
          test -s "${repo_root}/dalinira.gpg"
          ls -l "${out_dir}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pacman-repo

  deploy:
    name: Deploy pacman repository to GitHub Pages
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
