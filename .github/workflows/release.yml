name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing v-prefixed release tag to build and publish
        required: true
        default: v8.0.0

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate tag and version
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref_name }}
      - name: Tag matches every stated version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_REF}" = "v${version}"
          scripts/check-release-metadata.sh

  # Every package, built in its own distribution's container, the non-GUI
  # test tier on the release build, and a fresh install of each package with
  # the package manager alone (.github/workflows/packages.yml).
  packages:
    name: Packages
    needs: validate-tag
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ inputs.release_ref || github.ref_name }}
      run_tests: true

  publish:
    name: Publish GitHub release
    needs: packages
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref_name }}

      - name: Download the portable archive and the native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{portable,package-debian12,package-ubuntu2404,package-fedora}"
          path: dist
          merge-multiple: true

      - name: Check the release assets
        run: |
          version="${RELEASE_REF#v}"
          cd dist
          ls -l
          # One portable archive, two .deb, one .rpm; all named after this
          # version. Arch packages go to the pacman repository instead
          # (pacman-repo.yml), so they are not attached here.
          test -f "dalinira-browser-${version}-linux-x86_64.tar.zst"
          test "$(ls ./*.deb | wc -l)" -eq 2
          test "$(ls ./*.rpm | wc -l)" -eq 1
          test "$(ls | wc -l)" -eq 4
          for asset in *; do
            case "$asset" in *"${version}"*) ;; *) echo "unversioned asset $asset" >&2; exit 1 ;; esac
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_REF#v}"
          cd dist
          sha256sum "dalinira-browser-${version}-linux-x86_64.tar.zst" > SHA256SUMS
          sha256sum ./*.deb ./*.rpm | sed 's#\./##' > SHA256SUMS-native-packages
          gh release create "${RELEASE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DaliNira Browser ${version}" \
            --notes-file "../docs/RELEASE_NOTES_v${version}.md" \
            "dalinira-browser-${version}-linux-x86_64.tar.zst" SHA256SUMS \
            ./*.deb ./*.rpm SHA256SUMS-native-packages
