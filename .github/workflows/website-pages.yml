name: Publish Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - packaging/pacman/index.html
      - packaging/pacman/dalinira.repo
      - .github/workflows/website-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble website and repository files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assemble Pages content
        run: |
          set -euo pipefail
          page_root="${RUNNER_TEMP}/dalinira-pages"
          install -dm755 "${page_root}/x86_64"
          cp -a website/. "${page_root}/"
          install -Dm644 packaging/pacman/index.html "${page_root}/pacman.html"
          install -Dm644 packaging/pacman/dalinira.repo "${page_root}/dalinira.repo"

          # The signed pacman repository lives on these Pages (x86_64/,
          # published by Publish Pacman Repo). A deployment replaces the whole
          # site, so carry the repository that is online now over unchanged.
          site="https://muhammed-dali.github.io/DaliNira-Browser"
          carry="${RUNNER_TEMP}/pacman-repo"
          install -dm755 "${carry}"
          if curl -fsSL -o "${carry}/dalinira.db" "${site}/x86_64/dalinira.db"; then
            complete=1
            packages="$(tar -xzOf "${carry}/dalinira.db" --wildcards '*/desc' | awk 'take { print; take = 0 } /^%FILENAME%$/ { take = 1 }')"
            for file in dalinira.db.sig dalinira.db.tar.gz dalinira.db.tar.gz.sig dalinira.files dalinira.files.tar.gz \
                        $(for package in ${packages}; do echo "${package}" "${package}.sig"; done); do
              if ! curl -fsSL -o "${carry}/${file}" "${site}/x86_64/${file}"; then
                echo "::warning::${site}/x86_64/${file} is missing; the pacman repository is not carried over."
                complete=0
                break
              fi
            done
            for file in dalinira.files.sig dalinira.files.tar.gz.sig; do
              curl -fsSL -o "${carry}/${file}" "${site}/x86_64/${file}" || rm -f "${carry}/${file}"
            done
            if [ "${complete}" -eq 1 ] && curl -fsSL -o "${page_root}/dalinira.gpg" "${site}/dalinira.gpg"; then
              cp -f "${carry}"/* "${page_root}/x86_64/"
            else
              rm -f "${page_root}/dalinira.gpg"
            fi
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/dalinira-pages

  deploy:
    name: Deploy website to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
